<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ligas | Central Pro</title><style>@import url("app-shell.css?v=2");@import url("legacy-pages.css?v=1");@import url("design-system.css?v=1");
:root{--bg:#09111c;--card:#101b28;--line:#223141;--txt:#f4f7fa;--muted:#98a6b7;--green:#16d96a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Arial,sans-serif}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1120px)/2))}.brand{font-size:20px;font-weight:850}.brand b,.green{color:var(--green)}a{text-decoration:none;color:var(--muted)}main{max-width:1120px;margin:auto;padding:28px 20px 50px}h1{margin:0 0 7px;font-size:26px}p{color:var(--muted);margin:0}.tabs{display:flex;gap:8px;margin:24px 0}.tab{background:var(--card);border:1px solid var(--line);color:#c5d0da;border-radius:7px;padding:10px 14px;cursor:pointer}.tab.active{background:var(--green);color:#062313;font-weight:800;border-color:var(--green)}.view{display:none}.view.active{display:block}.card{background:linear-gradient(145deg,#111d2a,#0e1824);border:1px solid var(--line);border-radius:9px;overflow:hidden}.head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{font-size:15px;margin:0}.league{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #1d2b39;cursor:pointer}.league:hover{background:#152332}.league img{width:33px;height:33px;object-fit:contain}.league small{color:var(--muted);display:block;margin-top:3px}.pick{color:var(--green);font-size:12px}.select{color:var(--txt);background:#0c1722;border:1px solid var(--line);padding:10px;border-radius:7px;min-width:250px}.table-head,.row{display:grid;grid-template-columns:40px 1fr 60px 60px 60px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid #1d2b39}.table-head{color:#7e8c9e;font-size:10px;text-transform:uppercase}.row img{width:25px;height:25px;object-fit:contain;vertical-align:middle;margin-right:8px}.row small{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:600px){.select{min-width:0;width:180px}.table-head,.row{grid-template-columns:30px 1fr 40px 40px 40px;padding:10px;font-size:12px}}
</style></head><body><header class="top"><a class="brand" href="index.html">Central <b>Pro</b></a><a href="index.html">← Dashboard</a></header><main><h1>Competições</h1><p>Escolha uma liga para consultar a classificação e os artilheiros.</p><nav class="tabs"><button class="tab active" data-view="leagues">Ligas do dia</button><button class="tab" data-view="standings">Classificação</button><button class="tab" data-view="scorers">Artilheiros</button></nav><section class="view active" id="leagues"><article class="card"><div class="head"><h2>Competições em jogo hoje</h2><span class="green" id="leagueCount"></span></div><div id="leagueList"><div class="empty">Carregando ligas…</div></div></article></section><section class="view" id="standings"><article class="card"><div class="head"><h2>Classificação</h2><select class="select" id="standingSelect"></select></div><div id="standingList"><div class="empty">Escolha uma liga.</div></div></article></section><section class="view" id="scorers"><article class="card"><div class="head"><h2>Artilheiros</h2><select class="select" id="scorerSelect"></select></div><div id="scorerList"><div class="empty">Escolha uma liga.</div></div></article></section></main><script>
let leagues=[];const esc=v=>{const e=document.createElement('i');e.textContent=v??'';return e.innerHTML};function fill(){const o=leagues.map(l=>`<option value="${l.id}|${l.season}">${esc(l.name)} · ${l.season}</option>`).join('');standingSelect.innerHTML=o;scorerSelect.innerHTML=o;leagueCount.textContent=`${leagues.length} ligas`;leagueList.innerHTML=leagues.length?leagues.map(l=>`<div class="league" data-v="${l.id}|${l.season}"><img src="${esc(l.logo)}"><span><b>${esc(l.name)}</b><small>${esc(l.country)} · Temporada ${l.season}</small></span><span class="pick">Ver dados →</span></div>`).join(''):'<div class="empty">Nenhuma liga encontrada hoje.</div>';document.querySelectorAll('.league').forEach(x=>x.onclick=()=>{standingSelect.value=x.dataset.v;scorerSelect.value=x.dataset.v;open('standings');loadStandings()});loadStandings();loadScorers()}function open(n){document.querySelector('.tab.active').classList.remove('active');document.querySelector('.view.active').classList.remove('active');document.querySelector(`[data-view="${n}"]`).classList.add('active');document.getElementById(n).classList.add('active');location.hash=n}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>open(b.dataset.view));function params(sel){const [id,season]=sel.value.split('|');return {id,season}}async function loadStandings(){const p=params(standingSelect);standingList.innerHTML='<div class="empty">Carregando classificação…</div>';try{const r=await fetch(`/api/ligas/${p.id}/classificacao?season=${p.season}`),d=await r.json();if(!r.ok)throw Error(d.erro);const rows=d.response?.[0]?.league?.standings?.flat()||[];standingList.innerHTML=rows.length?`<div class="table-head"><span>#</span><span>Time</span><span>J</span><span>SG</span><span>Pts</span></div>`+rows.map(x=>`<div class="row"><span class="green">${x.rank}</span><span><img src="${esc(x.team.logo)}"><b>${esc(x.team.name)}</b></span><span>${x.all.played}</span><span>${x.goalsDiff}</span><b>${x.points}</b></div>`).join(''):'<div class="empty">Classificação indisponível para esta competição.</div>'}catch(e){standingList.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function loadScorers(){const p=params(scorerSelect);scorerList.innerHTML='<div class="empty">Carregando artilheiros…</div>';try{const r=await fetch(`/api/ligas/${p.id}/artilheiros?season=${p.season}`),d=await r.json();if(!r.ok)throw Error(d.erro);const players=d.response||[];scorerList.innerHTML=players.length?`<div class="table-head"><span>#</span><span>Jogador</span><span>Time</span><span>J</span><span>Gols</span></div>`+players.map((x,i)=>{const s=x.statistics?.[0]||{};return `<div class="row"><span class="green">${i+1}</span><span><img src="${esc(x.player.photo)}"><b>${esc(x.player.name)}</b></span><span>${esc(s.team?.name)}</span><span>${s.games?.appearences??'—'}</span><b>${s.goals?.total??0}</b></div>`}).join(''):'<div class="empty">Artilheiros indisponíveis para esta competição.</div>'}catch(e){scorerList.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}standingSelect.onchange=loadStandings;scorerSelect.onchange=loadScorers;fetch('/api/ligas').then(r=>r.json().then(d=>({r,d}))).then(({r,d})=>{if(!r.ok)throw Error(d.erro);leagues=d.response||[];fill();if(location.hash==='#scorers')open('scorers');if(location.hash==='#standings')open('standings')}).catch(e=>leagueList.innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script>
<style>
:root{--bg:#020403;--card:#080c0a;--line:#19251f;--txt:#f5f7f6;--muted:#7d8984;--green:#00e676}body{background:radial-gradient(circle at 55% -10%,#0b1712,#020403 48%);font-family:Inter,Segoe UI,Arial,sans-serif}.top{height:72px;background:#050706;border-color:#17211c}.brand{color:#f5f7f6;font-weight:900}.brand b{color:var(--green)}main{max-width:1180px;padding-top:32px}.tab{background:#080c0a;border-color:#1b2922;color:#aeb8b3}.tab:hover{border-color:#087d41;color:var(--green)}.tab.active{background:#08351f;color:var(--green);border-color:#087d41}.card{background:linear-gradient(145deg,#0a0f0d,#050806);border-color:#1a2721;box-shadow:0 12px 40px rgba(0,0,0,.2)}.head,.league,.table-head,.row{border-color:#16221c}.league:hover,.row:hover{background:rgba(0,230,118,.045)}.select{background:#050907;border-color:#1b2922}.group-title{padding:10px 16px;background:#07170f;border-top:1px solid #17452e;border-bottom:1px solid #17452e;color:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
#scorerList .table-head,#scorerList .row{grid-template-columns:40px minmax(260px,1fr) minmax(180px,.55fr) 60px 60px}#scorerList .row>span:nth-child(3){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script src="competition-config.js?v=1"></script><script>
const featuredLeagueIds=CP_MAIN_LEAGUES;
const fillEveryLeague=fill;
fill=function(){leagues=leagues.filter(league=>featuredLeagueIds.has(league.id));fillEveryLeague()};
loadStandings=async function(){const p=params(standingSelect);standingList.innerHTML='<div class="empty">Carregando classificação…</div>';try{const r=await fetch(`/api/ligas/${p.id}/classificacao?season=${p.season}`),d=await r.json();if(!r.ok)throw Error(d.erro);const groups=d.response?.[0]?.league?.standings||[];standingList.innerHTML=groups.length?groups.map((rows,index)=>{const title=rows[0]?.group;return `${groups.length>1?`<div class="group-title">${esc(title||`Grupo ${index+1}`)}</div>`:''}<div class="table-head"><span>#</span><span>Time</span><span>J</span><span>SG</span><span>Pts</span></div>${rows.map(x=>`<div class="row"><span class="green">${x.rank}</span><span><img src="${esc(x.team.logo)}"><b>${esc(x.team.name)}</b></span><span>${x.all.played}</span><span>${x.goalsDiff}</span><b>${x.points}</b></div>`).join('')}`}).join(''):'<div class="empty">Classificação indisponível para esta competição.</div>'}catch(e){standingList.innerHTML=`<div class="empty">${esc(e.message)}</div>`}};
standingSelect.onchange=loadStandings;
</script>
