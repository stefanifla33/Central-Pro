<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogador | Central Pro</title><style>@import url("app-shell.css?v=1");@import url("legacy-pages.css?v=1");
:root{--bg:#020403;--line:#19251f;--text:#f5f7f6;--muted:#84918b;--green:#00e676;--cyan:#35c9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -10%,#0b1712,#020403 48%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1160px)/2));background:#050706}.brand{font-size:20px;font-weight:900}.brand b{color:var(--green)}.wrap{max-width:1160px;margin:auto;padding:30px 24px}.hero{display:grid;grid-template-columns:130px 1fr auto;gap:24px;align-items:center;padding:25px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#0a0f0d,#050806)}.hero>img{width:125px;height:125px;border-radius:50%;object-fit:cover;background:#102019}.hero h1{font-size:29px;margin:0 0 8px}.hero p{color:var(--muted);margin:4px 0}.season label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.season select{padding:10px 30px 10px 12px;border:1px solid #26352e;border-radius:7px;background:#050907;color:#fff}.clubs{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.club{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#060a08;font-size:12px}.club img{width:24px;height:24px;object-fit:contain}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.metric,.panel{border:1px solid var(--line);border-radius:9px;background:#070b09}.metric{padding:16px}.metric small{color:var(--muted);display:block}.metric b{display:block;font-size:22px;margin-top:7px}.panels{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.panel{overflow:hidden}.panel h2{font-size:15px;margin:0;padding:15px;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr auto;gap:15px;padding:12px 15px;border-top:1px solid #15211b}.row:first-of-type{border-top:0}.row span{color:var(--muted)}.competition{display:grid;grid-template-columns:35px 1fr repeat(3,58px);align-items:center;gap:10px;padding:12px 15px;border-top:1px solid #15211b}.competition img{width:30px;height:30px;object-fit:contain}.competition small{display:block;color:var(--muted);margin-top:3px}.competition .num{text-align:center}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:600px){.hero{grid-template-columns:85px 1fr}.hero>img{width:82px;height:82px}.season{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.competition{grid-template-columns:32px 1fr 45px}.competition>:nth-last-child(2){display:none}.wrap{padding:20px 12px}}
</style></head><body><header class="top"><a class="brand" href="index.html">CENTRAL <b>PRO</b></a><a href="players.html">← Buscar jogadores</a></header><main class="wrap" id="app"><div class="empty">Carregando jogador…</div></main><script>
const params=new URLSearchParams(location.search),id=params.get('id'),initialSeason=Number(params.get('season'))||new Date().getFullYear(),app=document.getElementById('app'),esc=v=>{const e=document.createElement('i');e.textContent=v??'—';return e.innerHTML},sum=(rows,path)=>rows.reduce((total,x)=>{let v=x;for(const k of path)v=v?.[k];return total+(Number(v)||0)},0);function seasonOptions(selected){let html='';for(let y=new Date().getFullYear()+1;y>=2018;y--)html+=`<option ${y===selected?'selected':''}>${y}</option>`;return html}async function load(season=initialSeason){app.innerHTML='<div class="empty">Carregando jogador…</div>';try{if(!/^\d+$/.test(id||''))throw Error('ID do jogador inválido.');const r=await fetch(`/api/jogadores/${id}?season=${season}`),d=await r.json();if(!r.ok)throw Error(d.erro||'Jogador indisponível.');const p=d.player,s=d.statistics,appearances=sum(s,['games','appearences']),goals=sum(s,['goals','total']),assists=sum(s,['goals','assists']),minutes=sum(s,['games','minutes']),yellow=sum(s,['cards','yellow']),red=sum(s,['cards','red']),teams=[...new Map(s.filter(x=>x.team).map(x=>[x.team.id,x.team])).values()];document.title=`${p.name} | Central Pro`;app.innerHTML=`<section class="hero"><img src="${esc(p.photo)}"><div><h1>${esc(p.name)}</h1><p>${esc(p.firstname)} ${esc(p.lastname)}</p><p>${esc(p.nationality)} · ${esc(p.age)} anos · ${esc(p.height)} · ${esc(p.weight)}</p><div class="clubs">${teams.map(t=>`<a class="club" href="team.html?id=${t.id}"><img src="${esc(t.logo)}">${esc(t.name)}</a>`).join('')||'<span class="club">Sem clube informado nesta temporada</span>'}</div></div><div class="season"><label>Temporada</label><select id="season">${seasonOptions(d.season)}</select></div></section><section class="stats"><div class="metric"><small>Jogos</small><b>${appearances}</b></div><div class="metric"><small>Minutos</small><b>${minutes}</b></div><div class="metric"><small>Gols</small><b>${goals}</b></div><div class="metric"><small>Assistências</small><b>${assists}</b></div><div class="metric"><small>Amarelos</small><b>${yellow}</b></div><div class="metric"><small>Vermelhos</small><b>${red}</b></div></section><div class="panels"><section class="panel"><h2>Desempenho por competição</h2>${s.length?s.map(x=>`<div class="competition"><img src="${esc(x.league?.logo)}"><div><b>${esc(x.league?.name)}</b><small>${esc(x.team?.name)} · ${esc(x.league?.country)}</small></div><div class="num"><b>${x.games?.appearences??0}</b><small>jogos</small></div><div class="num"><b>${x.goals?.total??0}</b><small>gols</small></div><div class="num"><b>${x.goals?.assists??0}</b><small>assist.</small></div></div>`).join(''):'<div class="empty">Sem estatísticas para esta temporada.</div>'}</section><section class="panel"><h2>Informações</h2><div class="row"><span>Data de nascimento</span><b>${esc(p.birth?.date)}</b></div><div class="row"><span>Local</span><b>${esc(p.birth?.place)}</b></div><div class="row"><span>País de nascimento</span><b>${esc(p.birth?.country)}</b></div><div class="row"><span>Lesionado</span><b>${p.injured?'Sim':'Não'}</b></div><div class="row"><span>Transferências registradas</span><b>${d.transfers.length}</b></div></section></div>`;document.getElementById('season').onchange=e=>{const y=Number(e.target.value);history.replaceState(null,'',`?id=${id}&season=${y}`);load(y)}}catch(e){app.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}load();
</script><script src="legacy-shell.js?v=1" data-active="players"></script></body></html>
