<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar jogadores | Central Pro</title><style>
:root{--bg:#020403;--line:#19251f;--text:#f5f7f6;--muted:#84918b;--green:#00e676}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -10%,#0b1712,#020403 48%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1160px)/2));background:#050706}.brand{font-size:21px;font-weight:900}.brand b{color:var(--green)}.wrap{max-width:1160px;margin:auto;padding:42px 24px}.hero h1{font-size:30px;margin:0 0 8px}.hero p,.meta{color:var(--muted)}.search{display:flex;gap:9px;max-width:740px;margin-top:24px}.search input{flex:1;padding:14px 16px;border-radius:8px;border:1px solid #26352e;background:#070b09;color:#fff;font-size:15px;outline:0}.search input:focus{border-color:#078246;box-shadow:0 0 0 3px #00e67612}.search button{border:0;border-radius:8px;padding:0 23px;background:var(--green);color:#021108;font-weight:900;cursor:pointer}.meta{height:40px;padding-top:13px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.player{display:grid;grid-template-columns:64px 1fr auto;gap:13px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(145deg,#0a0f0d,#050806)}.player:hover{border-color:#087d41;background:#08150e}.player img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#102019}.player h2{font-size:15px;margin:0 0 5px}.player p{color:var(--muted);font-size:12px;margin:2px 0}.open{color:var(--green);font-size:20px}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:#060a08}@media(max-width:850px){.results{grid-template-columns:1fr 1fr}}@media(max-width:570px){.results{grid-template-columns:1fr}.search{flex-direction:column}.search button{padding:13px}}
</style></head><body><header class="top"><a class="brand" href="index.html">CENTRAL <b>PRO</b></a><a href="index.html">← Dashboard</a></header><main class="wrap"><section class="hero"><h1>Buscar jogadores</h1><p>Pesquise atletas do futebol mundial e consulte seu desempenho por temporada.</p><form class="search" id="form"><input id="query" autocomplete="off" maxlength="60" placeholder="Ex.: Neymar, Haaland, Messi..."><button>Buscar</button></form><div class="meta" id="meta">Digite pelo menos 3 caracteres.</div></section><section class="results" id="results"><div class="empty">Os jogadores encontrados aparecerão aqui.</div></section></main><script>
const $=id=>document.getElementById(id),esc=v=>{const e=document.createElement('i');e.textContent=v??'—';return e.innerHTML};async function search(q){$('meta').textContent='Buscando…';$('results').innerHTML='<div class="empty">Consultando a API-Football…</div>';try{const r=await fetch(`/api/jogadores/busca?q=${encodeURIComponent(q)}`),d=await r.json();if(!r.ok)throw Error(d.erro||'Busca indisponível.');$('meta').textContent=`${d.response.length} jogador(es) encontrado(s)`;$('results').innerHTML=d.response.length?d.response.map(x=>{const p=x.player;return `<a class="player" href="player.html?id=${p.id}"><img src="${esc(p.photo)}"><div><h2>${esc(p.name)}</h2><p>${esc(p.nationality)} · ${esc(p.age)} anos</p><p>${esc(p.position||'Jogador')}</p></div><span class="open">›</span></a>`}).join(''):'<div class="empty">Nenhum jogador encontrado.</div>'}catch(e){$('meta').textContent='Não foi possível concluir a busca.';$('results').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('form').onsubmit=e=>{e.preventDefault();const q=$('query').value.trim();if(q.length<3){$('meta').textContent='Digite pelo menos 3 caracteres.';return}history.replaceState(null,'',`?q=${encodeURIComponent(q)}`);search(q)};const initial=new URLSearchParams(location.search).get('q');if(initial){$('query').value=initial;search(initial)}
</script></body></html>
