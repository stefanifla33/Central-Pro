<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus times | Central Pro</title><script src="auth-guard.js?v=2"></script><style>@import url("app-shell.css?v=2");@import url("legacy-pages.css?v=1");
:root{--bg:#020403;--card:#080c0a;--line:#19251f;--text:#f5f7f6;--muted:#84918b;--green:#00e676}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -10%,#0b1712,#020403 48%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1160px)/2));background:#050706}.brand{font-size:21px;font-weight:900}.brand b,.green{color:var(--green)}.wrap{max-width:1160px;margin:auto;padding:40px 24px}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.head h1{font-size:30px;margin:0 0 7px}.head p{color:var(--muted);margin:0}.find{padding:10px 14px;border:1px solid #27633f;border-radius:7px;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.team{border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#0a0f0d,#050806);overflow:hidden}.team-head{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:18px}.team-head:hover{background:#0a1810}.team-head img{width:64px;height:64px;object-fit:contain}.team-head h2{font-size:17px;margin:0 0 5px}.team-head p{color:var(--muted);margin:0;font-size:12px}.remove{border:1px solid #55322f;background:#1d0d0b;color:#ff8f85;border-radius:6px;padding:7px 10px;cursor:pointer}.games{border-top:1px solid var(--line)}.games h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:11px 14px;margin:0}.game{display:grid;grid-template-columns:60px 1fr 48px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid #142019;cursor:pointer;font-size:12px}.game:hover{background:#0a1810}.game time{font-weight:800}.game span{text-align:center}.game b{text-align:right;color:var(--green)}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px solid var(--line);border-radius:10px;background:#060a08;color:var(--muted)}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:8px}.empty a{display:inline-block;margin-top:16px;padding:10px 15px;border-radius:7px;background:var(--green);color:#021108;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;gap:16px}}@media(max-width:520px){.wrap{padding:25px 12px}.head{display:block}.find{display:inline-block;margin-top:15px}.team-head{grid-template-columns:52px 1fr}.team-head img{width:52px;height:52px}.remove{grid-column:1/-1}}
</style></head><body><header class="top"><a class="brand" href="index.html">CENTRAL <b>PRO</b></a><a href="index.html">← Dashboard</a></header><main class="wrap"><section class="head"><div><h1>Meus times</h1><p>Acompanhe rapidamente os próximos jogos dos clubes favoritos.</p></div><a class="find" href="teams.html">+ Adicionar time</a></section><section class="grid" id="grid"><div class="empty">Carregando favoritos…</div></section></main><script>
const grid=document.getElementById('grid'),esc=v=>{const e=document.createElement('i');e.textContent=v??'—';return e.innerHTML},read=()=>{try{return JSON.parse(localStorage.getItem('centralProFavoriteTeams')||'[]').filter(Number.isInteger)}catch{return[]}},formatDate=x=>new Date(x).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}),formatTime=x=>new Date(x).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});function game(g){return `<div class="game" data-game="${g.fixture.id}"><time>${formatDate(g.fixture.date)}</time><span>${esc(g.teams.home.name)} × ${esc(g.teams.away.name)}</span><b>${formatTime(g.fixture.date)}</b></div>`}function bind(){document.querySelectorAll('[data-game]').forEach(x=>x.onclick=()=>location.href=`match.html?id=${x.dataset.game}`);document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>{e.preventDefault();e.stopPropagation();const id=Number(x.dataset.remove),ids=read().filter(v=>v!==id);localStorage.setItem('centralProFavoriteTeams',JSON.stringify(ids));load()})}async function load(){const ids=read();if(!ids.length){grid.innerHTML='<div class="empty"><strong>Você ainda não favoritou nenhum time.</strong>Abra a busca, escolha um clube e clique em “Adicionar aos meus times”.<br><a href="teams.html">Buscar times</a></div>';return}grid.innerHTML='<div class="empty">Carregando seus times…</div>';try{const r=await fetch(`/api/times/favoritos?ids=${ids.join(',')}`),d=await r.json();if(!r.ok)throw Error(d.erro||'Favoritos indisponíveis.');grid.innerHTML=d.response.map(x=>`<article class="team"><a class="team-head" href="team.html?id=${x.team.id}"><img src="${esc(x.team.logo)}"><div><h2>${esc(x.team.name)}</h2><p>${esc(x.team.country)}${x.venue?.city?' · '+esc(x.venue.city):''}</p></div><button class="remove" type="button" data-remove="${x.team.id}">Remover</button></a><div class="games"><h3>Próximas partidas</h3>${x.upcoming.length?x.upcoming.map(game).join(''):'<div class="game"><span style="grid-column:1/-1;color:var(--muted)">Nenhuma partida programada.</span></div>'}</div></article>`).join('');bind()}catch(e){grid.innerHTML=`<div class="empty"><strong>Não foi possível carregar.</strong>${esc(e.message)}</div>`}}load();
</script><script src="legacy-shell.js?v=2"></script></body></html>
