<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time | Central Pro</title>
<style>@import url("app-shell.css?v=1");@import url("legacy-pages.css?v=1");
:root{--bg:#020403;--card:#080c0a;--line:#19251f;--text:#f5f7f6;--muted:#84918b;--green:#00e676;--red:#ff5c70}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -10%,#0b1712,#020403 48%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1160px)/2));background:#050706}.brand{font-size:20px;font-weight:900}.brand b,.green{color:var(--green)}.wrap{max-width:1160px;margin:auto;padding:30px 24px}.hero{display:grid;grid-template-columns:105px 1fr auto;gap:22px;align-items:center;padding:25px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#0a0f0d,#050806)}.hero img{width:100px;height:100px;object-fit:contain}.hero h1{font-size:28px;margin:0 0 7px}.hero p{color:var(--muted);margin:4px 0}.favorite{padding:10px 14px;border:1px solid #27633f;border-radius:7px;background:#082317;color:var(--green);cursor:pointer}.favorite.active{background:var(--green);color:#021108}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}.box,.panel{border:1px solid var(--line);border-radius:9px;background:#070b09}.box{padding:17px}.box small{color:var(--muted)}.box b{display:block;font-size:21px;margin-top:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{overflow:hidden;margin-bottom:14px}.panel h2{font-size:15px;margin:0;padding:15px;border-bottom:1px solid var(--line)}.game{display:grid;grid-template-columns:76px 1fr 65px;gap:10px;align-items:center;padding:13px 15px;border-top:1px solid #15211b;cursor:pointer}.game:first-of-type{border-top:0}.game:hover{background:#0a1810}.game small,.league{color:var(--muted)}.match{text-align:center}.score{text-align:right;font-weight:900}.squad{display:grid;grid-template-columns:repeat(3,1fr)}.player{display:flex;gap:10px;align-items:center;padding:12px 15px;border-top:1px solid #15211b}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#102019}.player b,.player small{display:block}.player small{color:var(--muted);margin-top:3px}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:800px){.columns{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.squad{grid-template-columns:1fr 1fr}.hero{grid-template-columns:75px 1fr}.hero img{width:70px;height:70px}.favorite{grid-column:1/-1}}@media(max-width:520px){.squad{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.wrap{padding:20px 12px}}
</style></head><body><header class="top"><a class="brand" href="index.html">CENTRAL <b>PRO</b></a><a href="teams.html">← Buscar times</a></header><main class="wrap" id="app"><div class="empty">Carregando time…</div></main>
<script>
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app'),esc=v=>{const e=document.createElement('i');e.textContent=v??'—';return e.innerHTML},finished=new Set(['FT','AET','PEN']),date=x=>new Date(x).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}),favoriteIds=()=>{try{const value=JSON.parse(localStorage.getItem('centralProFavoriteTeams')||'[]');return Array.isArray(value)?value.filter(Number.isInteger):[]}catch{return[]}};function result(g,team){const home=g.teams.home.id===team,a=home?g.goals.home:g.goals.away,b=home?g.goals.away:g.goals.home;return a>b?'V':a===b?'E':'D'}function games(rows,team,upcoming=false){return rows.length?rows.map(g=>`<div class="game" data-id="${g.fixture.id}"><span><b>${date(g.fixture.date)}</b><small>${esc(g.league.name)}</small></span><span class="match">${esc(g.teams.home.name)} × ${esc(g.teams.away.name)}</span><span class="score ${upcoming?'green':''}">${upcoming?new Date(g.fixture.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):`${g.goals.home??'—'} - ${g.goals.away??'—'}`}</span></div>`).join(''):'<div class="empty">Nenhuma partida disponível.</div>'}function bind(){document.querySelectorAll('.game').forEach(x=>x.onclick=()=>location.href=`match.html?id=${x.dataset.id}`);const fav=document.getElementById('favorite');let ids=favoriteIds();const sync=()=>{fav.classList.toggle('active',ids.includes(Number(id)));fav.textContent=ids.includes(Number(id))?'★ Nos meus times':'☆ Adicionar aos meus times'};fav.onclick=()=>{const n=Number(id);ids=ids.includes(n)?ids.filter(x=>x!==n):[...ids,n];localStorage.setItem('centralProFavoriteTeams',JSON.stringify(ids));sync()};sync()}async function load(){try{if(!/^\d+$/.test(id||''))throw Error('ID do time inválido.');const r=await fetch(`/api/times/${id}`),d=await r.json();if(!r.ok)throw Error(d.erro||'Time indisponível.');document.title=`${d.team.name} | Central Pro`;const last=d.recent.filter(g=>finished.has(g.fixture.status.short)),wins=last.filter(g=>result(g,d.team.id)==='V').length,goals=last.reduce((s,g)=>s+(g.teams.home.id===d.team.id?(g.goals.home||0):(g.goals.away||0)),0);app.innerHTML=`<section class="hero"><img src="${esc(d.team.logo)}"><div><h1>${esc(d.team.name)}</h1><p>${esc(d.team.country)} · Fundado em ${esc(d.team.founded)}</p><p>${esc(d.venue?.name)}${d.venue?.city?' · '+esc(d.venue.city):''}</p></div><button class="favorite" id="favorite"></button></section><section class="summary"><div class="box"><small>Últimos jogos</small><b>${last.length}</b></div><div class="box"><small>Vitórias</small><b>${wins}</b></div><div class="box"><small>Gols marcados</small><b>${goals}</b></div><div class="box"><small>Próximas partidas</small><b>${d.upcoming.length}</b></div></section><div class="columns"><section class="panel"><h2>Últimos resultados</h2>${games(last,d.team.id)}</section><section class="panel"><h2>Próximas partidas</h2>${games(d.upcoming,d.team.id,true)}</section></div><section class="panel"><h2>Elenco atual</h2><div class="squad">${d.squad.length?d.squad.map(p=>`<div class="player"><img src="${esc(p.photo)}"><span><b>${esc(p.name)}</b><small>${esc(p.position)} · ${esc(p.age)} anos</small></span></div>`).join(''):'<div class="empty">Elenco indisponível para este time.</div>'}</div></section>`;bind()}catch(e){app.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}load();
</script><script src="legacy-shell.js?v=1"></script></body></html>
