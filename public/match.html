nt-weight:900;color:var(--green)}.state{color:var(--muted);font-size:12px;margin-top:11px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid var(--line);border-radius:7px;padding:10px 14px;background:var(--card);color:#c5d0da;white-space:nowrap;cursor:pointer}.tab.active{background:var(--green);border-color:var(--green);color:#062313;font-weight:850}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{padding:17px}.card h2{font-size:15px;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #1e2d3c;color:var(--muted)}.row:last-child{border:0}.row strong{color:var(--txt);text-align:right}.highlight{border-left:3px solid var(--green)}.hint{font-size:12px;color:var(--muted);line-height:1.55}.stat-row{display:grid;grid-template-columns:1fr 1.15fr 1fr;text-align:center;padding:10px;border-bottom:1px solid #1e2d3c}.stat-row strong:first-child{text-align:left}.stat-row strong:last-child{text-align:right}.stat-row span{color:var(--muted);font-size:12px}.event{display:grid;grid-template-columns:45px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #1e2d3c}.event time{color:var(--green);font-weight:800}.lineups{display:grid;grid-template-columns:1fr 1fr;gap:13px}.player{padding:10px 0;border-bottom:1px solid #1e2d3c}.empty{padding:42px;text-align:center;color:var(--muted)}@media(max-width:850px){.layout{padding-left:0}.sidebar{display:none}main{padding:20px 14px}.grid,.lineups{grid-template-columns:1fr}.teams{gap:12px}.team{font-size:16px}.team img{width:43px;height:43px}.score{font-size:23px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="ball">⚽</span><span>CENTRAL <b>PRO</b><small>API-FOOTBALL</small></span></div><nav class="nav"><a href="index.html">⌂ &nbsp; Dashboard</a><div class="nav-title">PARTIDAS</div><a href="index.html#live">◉ &nbsp; Ao vivo</a><a class="active" href="games.html">▣ &nbsp; Detalhes da partida</a><a href="index.html#upcoming">◷ &nbsp; Próximas</a><div class="nav-title">ANÁLISE</div><a href="#analysis">⌁ &nbsp; Análise pré-jogo</a><a href="#stats">▥ &nbsp; Estatísticas</a><a href="#lineups">♟ &nbsp; Escalações</a></nav><div class="api"><span class="dot"></span> API Status<br><b class="green">Online</b><br><br>Dados protegidos no servidor</div></aside><main><header class="top"><a class="back" href="index.html">← Voltar ao dashboard</a><span class="server"><span class="dot"></span>Servidor: <b class="green">Online</b></span></header><section class="hero" id="hero"><div class="empty">Carregando partida…</div></section><nav class="tabs"><button class="tab active" data-tab="overview">Visão geral</button><button class="tab" data-tab="analysis">Análise pré-jogo</button><button class="tab" data-tab="stats">Estatísticas</button><button class="tab" data-tab="events">Eventos</button><button class="tab" data-tab="lineups">Escalações</button></nav><section class="view active" id="overview"></section><section class="view" id="analysis"><div class="card"><div class="empty">Abra esta aba para carregar a análise.</div></div></section><section class="view" id="stats"></section><section class="view" id="events"></section><section class="view" id="lineups"></section></main></div><script>
const id=new URLSearchParams(location.search).get('id'),liveS=['1H','HT','2H','ET','LIVE'];let data;const safe=v=>{const e=document.createElement('i');e.textContent=v??'—';return e.innerHTML},value=(s,n)=>s?.find(x=>x.type===n)?.value??'—';function setTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');document.querySelector('.view.active').classList.remove('active');b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');if(b.dataset.tab==='analysis')loadAnalysis()})}function render(d){const x=d.fixture;if(!x)throw Error('Partida não encontrada.');document.title=`${x.teams.home.name} x ${x.teams.away.name} | Central Pro`;const h=d.statistics[0]?.statistics||[],a=d.statistics[1]?.statistics||[],active=liveS.includes(x.fixture.status.short);document.getElementById('hero').innerHTML=`<div class="comp">${safe(x.league.name)} · ${safe(x.league.country)} · ${safe(x.league.round)}</div><div class="teams"><div class="team"><img src="${safe(x.teams.home.logo)}"><div>${safe(x.teams.home.name)}</div></div><div><div class="score">${x.goals.home??0} × ${x.goals.away??0}</div><div class="state">${active?'<b style="color:var(--red)">● AO VIVO</b> · '+(x.fixture.status.elapsed||'')+"'":x.fixture.status.short==='FT'?'Finalizado':new Date(x.fixture.date).toLocaleString('pt-BR',{dateStyle:'full',timeStyle:'short'})}</div></div><div class="team"><img src="${safe(x.teams.away.logo)}"><div>${safe(x.teams.away.name)}</div></div></div>`;document.getElementById('overview').innerHTML=`<div class="grid"><article class="card"><h2>Informações da partida</h2><div class="row"><span>Competição</span><strong>${safe(x.league.name)}</strong></div><div class="row"><span>Estádio</span><strong>${safe(x.fixture.venue?.name)}</strong></div><div class="row"><span>Árbitro</span><strong>${safe(x.fixture.referee)}</strong></div></article><article class="card"><h2>Resumo ao vivo</h2><div class="row"><span>Posse de bola</span><strong>${value(h,'Ball Possession')} · ${value(a,'Ball Possession')}</strong></div><div class="row"><span>Chutes no alvo</span><strong>${value(h,'Shots on Goal')} · ${value(a,'Shots on Goal')}</strong></div><div class="row"><span>Escanteios</span><strong>${value(h,'Corner Kicks')} · ${value(a,'Corner Kicks')}</strong></div></article><article class="card highlight"><h2>Leitura responsável</h2><p class="hint">Os dados ajudam a entender a partida, mas não garantem resultados ou apostas. Use estatísticas e histórico como contexto.</p></article></div>`;const names=['Ball Possession','Total Shots','Shots on Goal','Corner Kicks','Fouls','Yellow Cards','Red Cards','Offsides'];document.getElementById('stats').innerHTML=`<article class="card"><h2>Estatísticas da partida</h2>${d.statistics.length?names.map(n=>`<div class="stat-row"><strong>${value(h,n)}</strong><span>${n}</span><strong>${value(a,n)}</strong></div>`).join(''):'<div class="empty">Estatísticas ainda não disponíveis.</div>'}</article>`;document.getElementById('events').innerHTML=`<article class="card"><h2>Eventos</h2>${d.events.length?d.events.map(e=>`<div class="event"><time>${e.time.elapsed}'</time><span>${safe(e.player?.name)}<br><small class="green">${safe(e.type)}${e.detail?' · '+safe(e.detail):''}</small></span><span>${safe(e.team?.name)}</span></div>`).join(''):'<div class="empty">Nenhum evento disponível.</div>'}</article>`;document.getElementById('lineups').innerHTML=d.lineups.length?`<div class="lineups">${d.lineups.map(l=>`<article class="card"><h2>${safe(l.team.name)} · ${safe(l.formation)}</h2>${(l.startXI||[]).map(p=>`<div class="player">${safe(p.player.name)} <span class="green">${safe(p.player.pos)}</span></div>`).join('')}</article>`).join('')}</div>`:'<article class="card"><div class="empty">Escalações ainda não divulgadas.</div></article>'}function form(g,t){return g.map(x=>{const home=x.teams.home.id===t,m=home?x.goals.home:x.goals.away,o=home?x.goals.away:x.goals.home;return m>o?'V':m===o?'E':'D'}).join(' · ')||'—'}function standing(x,t){return (x[0]?.league?.standings?.flat()||[]).find(r=>r.team.id===t)}function loadAnalysis(){const box=document.getElementById('analysis');if(box.dataset.loaded)return;box.innerHTML='<div class="card"><div class="empty">Calculando contexto da partida…</div></div>';fetch(`/api/partidas/${id}/analise`).then(r=>r.json().then(d=>({r,d}))).then(({r,d})=>{if(!r.ok)throw Error(d.erro||'Análise indisponível');box.dataset.loaded=1;const f=d.fixture,hs=standing(d.standings,f.teams.home.id),as=standing(d.standings,f.teams.away.id),h=d.h2h,hw=h.filter(g=>g.teams.home.id===f.teams.home.id?g.teams.home.winner:g.teams.away.winner).length,aw=h.filter(g=>g.teams.home.id===f.teams.away.id?g.teams.home.winner:g.teams.away.winner).length;box.innerHTML=`<div class="grid"><article class="card"><h2>Forma recente · ${safe(f.teams.home.name)}</h2><div class="row"><span>Últimos 5 jogos</span><strong>${form(d.homeRecent,f.teams.home.id)}</strong></div><div class="row"><span>Posição na liga</span><strong>${hs?hs.rank+'º · '+hs.points+' pts':'—'}</strong></div></article><article class="card"><h2>Forma recente · ${safe(f.teams.away.name)}</h2><div class="row"><span>Últimos 5 jogos</span><strong>${form(d.awayRecent,f.teams.away.id)}</strong></div><div class="row"><span>Posição na liga</span><strong>${as?as.rank+'º · '+as.points+' pts':'—'}</strong></div></article><article class="card highlight"><h2>Confronto direto</h2><div class="row"><span>Últimos confrontos</span><strong>${h.length||'—'}</strong></div><div class="row"><span>Vitórias ${safe(f.teams.home.name)}</span><strong>${hw}</strong></div><div class="row"><span>Vitórias ${safe(f.teams.away.name)}</span><strong>${aw}</strong></div><p class="hint">V = vitória, E = empate, D = derrota. Histórico é contexto, não previsão.</p></article></div>`}).catch(e=>box.innerHTML=`<div class="card"><div class="empty">${safe(e.message)}</div></div>`)}async function load(){try{if(!/^\d+$/.test(id||''))throw Error('ID de partida inválido.');const r=await fetch(`/api/partidas/${id}`);data=await r.json();if(!r.ok)throw Error(data.erro);render(data)}catch(e){document.getElementById('hero').innerHTML=`<div class="empty">${safe(e.message)}</div>`}}setTabs();load();
</script>

<style>

<script>
const originalRender=render;
function halfScore(f,period){const half=f.score?.halftime||{},full=f.score?.fulltime||{};if(period===1)return [half.home,half.away];if(period===2)return [full.home==null?null:full.home-(half.home||0),full.away==null?null:full.away-(half.away||0)];return [f.goals.home,f.goals.away]}
function periodCards(f){const total=halfScore(f,0),first=halfScore(f,1),second=halfScore(f,2);const card=(label,score,active='')=>`<div class="period-card ${active}"><small>${label}</small><div class="period-score"><span class="home">${score[0]??'—'}</span> × <span class="away">${score[1]??'—'}</span></div></div>`;return `<div class="periods">${card('PLACAR TOTAL',total,'active')}${card('1º TEMPO',first)}${card('2º TEMPO',second)}</div>`}
function eventPeriod(e){return (e.time?.elapsed||0)<=45?1:2}
function eventSummary(events,period){const list=period?events.filter(e=>eventPeriod(e)===period):events;const count=type=>list.filter(e=>e.type===type).length;return `<div class="period-summary"><div class="summary-item"><small>Gols</small><b>${count('Goal')}</b></div><div class="summary-item"><small>Cartões</small><b>${count('Card')}</b></div><div class="summary-item"><small>Substituições</small><b>${count('subst')}</b></div><div class="summary-item"><small>VAR</small><b>${count('Var')}</b></div></div>`}
function renderPeriodEvents(period=0){const box=document.getElementById('events'),events=period?data.events.filter(e=>eventPeriod(e)===period):data.events;document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.period)===period));box.querySelector('.period-summary').outerHTML=eventSummary(data.events,period);box.querySelector('.event-list').innerHTML=events.length?events.map(e=>`<div class="event"><time>${e.time.elapsed}'${e.time.extra?'+'+e.time.extra:''}</time><span>${safe(e.player?.name)}<br><small class="green">${safe(e.type)}${e.detail?' · '+safe(e.detail):''}</small></span><span>${safe(e.team?.name)}</span></div>`).join(''):'<div class="empty">Nenhum evento neste período.</div>'}
render=function(d){originalRender(d);const f=d.fixture;document.getElementById('overview').insertAdjacentHTML('afterbegin',periodCards(f));const stats=document.getElementById('stats');stats.insertAdjacentHTML('afterbegin',`${periodCards(f)}<div class="stats-note">Placar separado por tempo. As estatísticas abaixo são o total da partida, conforme disponibilizado pela competição.</div>`);document.getElementById('events').innerHTML=`<article class="card"><h2>Linha do tempo por período</h2>${periodCards(f)}<div class="period-filter"><button class="period-btn active" data-period="0">Todos</button><button class="period-btn" data-period="1">1º tempo</button><button class="period-btn" data-period="2">2º tempo</button></div>${eventSummary(d.events,0)}<div class="event-list">${d.events.length?d.events.map(e=>`<div class="event"><time>${e.time.elapsed}'${e.time.extra?'+'+e.time.extra:''}</time><span>${safe(e.player?.name)}<br><small class="green">${safe(e.type)}${e.detail?' · '+safe(e.detail):''}</small></span><span>${safe(e.team?.name)}</span></div>`).join(''):'<div class="empty">Nenhum evento disponível.</div>'}</div></article>`;document.querySelectorAll('.period-btn').forEach(b=>b.onclick=()=>renderPeriodEvents(Number(b.dataset.period)))};
</script>
<style>
.pregame-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.pregame-head h2{margin:0}.sample{color:var(--muted);font-size:11px}.period-switch{display:flex;gap:6px;padding:4px;background:#030605;border:1px solid var(--line);border-radius:8px}.period-switch button{border:0;border-radius:6px;background:transparent;color:#89968f;padding:8px 15px;cursor:pointer}.period-switch button.active{background:var(--green);color:#021108;font-weight:850}.compare-head{display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;text-align:center;padding:18px 10px;border-bottom:1px solid var(--line)}.compare-team{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:850}.compare-team img{width:40px;height:40px;object-fit:contain}.compare-vs{color:var(--muted);font-size:12px}.metric-row{display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line)}.metric-row:last-child{border:0}.metric-value{font-size:18px;font-weight:900;text-align:center}.metric-value.home{color:#ff8066}.metric-value.away{color:var(--cyan)}.metric-label{text-align:center;color:#aab5af;font-size:12px}.metric-bar{height:5px;background:#17221d;border-radius:5px;margin-top:6px;overflow:hidden}.metric-bar i{display:block;height:100%;background:var(--green);border-radius:5px}.analysis-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:13px}.form-badge{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:5px;margin:2px;font-size:11px;font-weight:900}.form-badge.win{background:#0d6b38}.form-badge.draw{background:#6a5915}.form-badge.loss{background:#722631}.analysis-note{margin-top:13px;padding:12px;border-left:3px solid var(--green);background:#07170f;color:#91a098;font-size:12px;line-height:1.5}@media(max-width:760px){.analysis-grid{grid-template-columns:1fr}.pregame-head{align-items:flex-start;flex-direction:column}.compare-head{grid-template-columns:1fr 50px 1fr}.compare-team{flex-direction:column}.metric-row{grid-template-columns:1fr 130px 1fr;padding:12px 8px}}
</style>
<script>
render=originalRender;
function splitResult(game,teamId,period){const isHome=game.teams.home.id===teamId,half=game.score?.halftime||{},full=game.score?.fulltime||{};let home,away;if(period===1){home=half.home;away=half.away}else if(period===2){home=full.home==null?null:full.home-(half.home||0);away=full.away==null?null:full.away-(half.away||0)}else{home=full.home??game.goals.home;away=full.away??game.goals.away}return home==null||away==null?null:{scored:isHome?home:away,conceded:isHome?away:home,total:home+away}}
function trend(games,teamId,period){const rows=games.map(g=>splitResult(g,teamId,period)).filter(Boolean),n=rows.length||1;return{n,scored:rows.reduce((s,x)=>s+x.scored,0)/n,conceded:rows.reduce((s,x)=>s+x.conceded,0)/n,over05:rows.filter(x=>x.total>.5).length*100/n,over15:rows.filter(x=>x.total>1.5).length*100/n,btts:rows.filter(x=>x.scored>0&&x.conceded>0).length*100/n,clean:rows.filter(x=>x.conceded===0).length*100/n}}
function cardAverage(stats,period){if(!stats?.cards?.yellow)return null;const first=['0-15','16-30','31-45'],second=['46-60','61-75','76-90'];const keys=period===1?first:period===2?second:[...first,...second],played=stats.fixtures?.played?.total||0;if(!played)return null;return keys.reduce((sum,key)=>sum+(stats.cards.yellow[key]?.total||0),0)/played}
function pct(v){return `${Math.round(v)}%`}function dec(v){return Number(v).toFixed(2)}
function metric(label,home,away,percent=false){const hv=percent?pct(home):dec(home),av=percent?pct(away):dec(away),max=Math.max(home,away,1);return `<div class="metric-row"><div><div class="metric-value home">${hv}</div><div class="metric-bar"><i style="width:${home/max*100}%"></i></div></div><div class="metric-label">${label}</div><div><div class="metric-value away">${av}</div><div class="metric-bar"><i style="width:${away/max*100}%"></i></div></div></div>`}
function formBadges(games,teamId){return games.slice(0,10).map(g=>{const r=splitResult(g,teamId,0),result=!r?'D':r.scored>r.conceded?'V':r.scored<r.conceded?'D':'E',cls=result==='V'?'win':result==='E'?'draw':'loss';return `<span class="form-badge ${cls}">${result}</span>`}).join('')||'—'}

atsPeriod),ac=cardAverage(info.awayTeamStats,currentStatsPeriod);content.innerHTML=`${periodControl()}<article class="card">${comparisonHeader(f)}<h2 class="stats-section-title">Cartões amarelos</h2>${hc!=null&&ac!=null?metric('Média por jogo',hc,ac):'<div class="empty">Dados de cartões indisponíveis.</div>'}<div class="analysis-note">Médias da temporada divididas pelos minutos em que os cartões ocorreram.</div></article>`;bindStatsPeriods();return}if(currentStatsSection==='corners'){if(!advancedInfo){content.innerHTML='<div class="card"><div class="empty">Carregando escanteios dos últimos 5 jogos…</div></div>';fetch(`/api/partidas/${id}/estatisticas-avancadas`).then(r=>r.json().then(x=>({r,x}))).then(({r,x})=>{if(!r.ok)throw Error(x.erro);advancedInfo=x;renderStatsSection()}).catch(e=>content.innerHTML=`<div class="card"><div class="empty">${safe(e.message)}</div></div>`);return}const home=advancedAverage(advancedInfo.home,'Corner Kicks'),away=advancedAverage(advancedInfo.away,'Corner Kicks');content.innerHTML=`${periodControl(true)}<article class="card">${comparisonHeader(f)}<h2 class="stats-section-title">Escanteios · últimos 5 jogos</h2>${metric('Média de escanteios',home,away)}<div class="unsupported">A API fornece escanteios somente para a partida completa; não há divisão confiável entre 1º e 2º tempo.</div></article>`}}

<script>
function compactMetric(label,home,away,percent=false){const hv=percent?pct(home):dec(home),av=percent?pct(away):dec(away),max=Math.max(home,away,1);return `<div class="metric-row"><div class="metric-side"><b class="metric-value home">${hv}</b><div class="metric-bar"><i style="width:${home/max*100}%"></i></div></div><div class="metric-label">${label}</div><div class="metric-side right"><b class="metric-value away">${av}</b><div class="metric-bar"><i style="width:${away/max*100}%"></i></div></div></div>`}
function rawCornerValue(rows){const value=rows?.find(x=>x.type==='Corner Kicks')?.value;if(value==null||value==='')return null;const parsed=Number.parseFloat(value);return Number.isFinite(parsed)?parsed:null}
function cornerTrend(rows){const values=rows.map(row=>({for:rawCornerValue(row.statistics),against:rawCornerValue(row.opponentStatistics)})).filter(x=>x.for!=null&&x.against!=null),n=values.length,lowSample=n>0&&n<3,average=select=>n?values.reduce((sum,item)=>sum+select(item),0)/n:null,frequency=(limit,select)=>{const hits=values.filter(item=>select(item)>limit).length;return[limit,n?hits*100/n:null,hits,n]},total=line=>frequency(line,x=>x.for+x.against),own=line=>frequency(line,x=>x.for);return{n,lowSample,for:average(x=>x.for),against:average(x=>x.against),total:average(x=>x.for+x.against),totals:[3.5,4.5,5.5,6.5,7.5,8.5,9.5].map(total),own:[3.5,4.5,5.5].map(own)}}
function cornerSampleLabel(trend){return trend.n?`${trend.lowSample?'Amostra baixa • ':''}${trend.n}/${currentSample} ${trend.n===1?'válido':'válidos'}`:'Sem dados'}
function compactCornerMetric(label,home,away,key){const values=[home[key],away[key]],valid=value=>Number.isFinite(value),max=Math.max(...values.filter(valid),1),side=(trend,value,position)=>`<div class="metric-side corner-metric-side ${position==='right'?'right':''}"><span><b class="metric-value ${position}">${valid(value)?dec(value):trend.n?'—':'Sem dados'}</b>${valid(value)?`<small class="corner-sample">${cornerSampleLabel(trend)}</small>`:''}</span><div class="metric-bar"><i style="width:${valid(value)?value/max*100:0}%"></i></div></div>`;return `<div class="metric-row">${side(home,home[key],'home')}<div class="metric-label">${label}</div>${side(away,away[key],'right')}</div>`}
function thresholdColumn(title,rows){return `<div class="threshold-col"><div class="threshold-head">${title}</div>${rows.map(([line,chance,hits,n])=>`<div class="threshold-row"><span>+ ${line}</span><div class="mini-bar"><i style="width:${chance}%"></i></div><b>${pct(chance)} <small>(${hits}/${n})</small></b></div>`).join('')}</div>`}
function limitedCornerBlock(name,trend){if(!trend.n)return `<div class="corner-limited empty"><strong>${safe(name)}</strong><span>Sem dados de escanteios disponíveis</span></div>`;return `<div class="corner-limited"><strong>Cobertura limitada — ${trend.n} de ${currentSample} ${trend.n===1?'jogo com dados':'jogos com dados'}</strong><span>${safe(name)}: ${dec(trend.for)} a favor <i>|</i> ${dec(trend.against)} contra <i>|</i> ${dec(trend.total)} total</span><small>${trend.n===1?'Valores do único jogo disponível.':'Médias calculadas somente com os dois jogos disponíveis.'} Não há amostra suficiente para calcular tendências.</small></div>`}
function cornerTeamAnalysis(name,trend){if(trend.n<3)return limitedCornerBlock(name,trend);return `<div class="corner-full"><div class="corner-full-head"><strong>${safe(name)}</strong><small>${trend.n}/${currentSample} jogos válidos</small></div>${thresholdColumn('Total da partida',trend.totals)}${thresholdColumn('Escanteios próprios',trend.own)}</div>`}
const baseRenderStatsSection=renderStatsSection;
const previousRenderStatsSection=()=>{if(advancedInfo?.source==='persistent-fixture-statistics-cache')advancedInfo=null;return baseRenderStatsSection()};
const cornerRowsForMatch=rows=>(rows||[]).map(row=>({fixture:{fixture:{id:row.fixtureId,date:row.date}},statistics:[{type:'Corner Kicks',value:row.own}],opponentStatistics:[{type:'Corner Kicks',value:row.opponent}]}));
renderStatsSection=function(){if(currentStatsSection!=='corners'){previousRenderStatsSection();const content=document.getElementById('statsContent');if(content&&!content.classList.contains('stats-shell'))content.classList.add('stats-shell');if(currentStatsSection==='goals'||currentStatsSection==='general')content.querySelectorAll('.card').forEach(x=>x.classList.add('compact-card'));content?.querySelectorAll('.metric-row').forEach(row=>{const left=row.children[0],right=row.children[2];if(left&&!left.classList.contains('metric-side')){left.classList.add('metric-side');right.classList.add('metric-side','right')}});return}const content=document.getElementById('statsContent');content.classList.add('stats-shell');if(!advancedInfo){const f=statisticsInfo.fixture;content.innerHTML='<div class="card"><div class="empty">Carregando histórico de escanteios…</div></div>';fetch(`/api/partidas/${id}/escanteios?sample=5&home=${f.teams.home.id}&away=${f.teams.away.id}`).then(r=>r.json().then(x=>({r,x}))).then(({r,x})=>{if(!r.ok)throw Error(x.erro);advancedInfo={...x,home:cornerRowsForMatch(x.home),away:cornerRowsForMatch(x.away)};renderStatsSection()}).catch(e=>content.innerHTML=`<div class="card"><div class="empty">${safe(e.message)}</div></div>`);return}const f=statisticsInfo.fixture,h=cornerTrend(advancedInfo.home),a=cornerTrend(advancedInfo.away),full=h.n>=3||a.n>=3;content.innerHTML=`<article class="card compact-card">${comparisonHeader(f)}<h2 class="stats-section-title">Escanteios · últimos 5 jogos válidos</h2>${full?`${compactCornerMetric('Média a favor',h.n>=3?h:{...h,for:null},a.n>=3?a:{...a,for:null},'for')}${compactCornerMetric('Média contra',h.n>=3?h:{...h,against:null},a.n>=3?a:{...a,against:null},'against')}${compactCornerMetric('Média total no jogo',h.n>=3?h:{...h,total:null},a.n>=3?a:{...a,total:null},'total')}`:''}<div class="corner-analysis-grid">${cornerTeamAnalysis(f.teams.home.name,h)}${cornerTeamAnalysis(f.teams.away.name,a)}</div><div class="coverage-note">Par </script>

<script>
function goalMarketTrend(games,teamId,period){const rows=games.map(g=>splitResult(g,teamId,period)).filter(Boolean),n=rows.length||1,chance=test=>rows.filter(test).length*100/n;return{n,over:[.5,1.5,2.5,3.5].map(line=>[line,chance(x=>x.total>line)]),under:[.5,1.5,2.5,3.5].map(line=>[line,chance(x=>x.total<line)]),teamScores:chance(x=>x.scored>0),opponentScores:chance(x=>x.conceded>0),btts:chance(x=>x.scored>0&&x.conceded>0),clean:chance(x=>x.conceded===0),win:chance(x=>x.scored>x.conceded),draw:chance(x=>x.scored===x.conceded),loss:chance(x=>x.scored<x.conceded)}}
function marketLines(rows,prefix){return rows.map(([line,chance])=>`<div class="market-line"><span>${prefix} ${line}</span><div class="mini-bar"><i style="width:${chance}%"></i></div><b>${pct(chance)}</b></div>`).join('')}
function singleMarket(label,chance){return `<div class="market-line"><span>${label}</span><div class="mini-bar"><i style="width:${chance}%"></i></div><b>${pct(chance)}</b></div>`}
function goalMarkets(info,period){const f=info.fixture,h=goalMarketTrend(info.homeRecent,f.teams.home.id,period),a=goalMarketTrend(info.awayRecent,f.teams.away.id,period),team=(name,data)=>`<div class="market-team"><h3>${safe(name)} · ${data.n} jogos</h3>${marketLines(data.over,'Mais de')}${marketLines(data.under,'Menos de')}${singleMarket('Time marca',data.teamScores)}${singleMarket('Adversário marca',data.opponentScores)}${singleMarket('Ambas marcam',data.btts)}${singleMarket('Sem sofrer',data.clean)}<div class="outcome-grid"><div class="outcome win"><b>${pct(data.win)}</b>Vitória</div><div class="outcome draw"><b>${pct(data.draw)}</b>Empate</div><div class="outcome loss"><b>${pct(data.loss)}</b>Derrota</div></div></div>`;return `<div class="market-block"><div class="market-title"><b>Mercados históricos de gols</b><small>${period===1?'1º tempo':period===2?'2º tempo':'Jogo completo'}</small></div><div class="market-table">${team(f.teams.home.name,h)}${team(f.teams.away.name,a)}</div><div class="coverage-note">Frequências observadas na amostra selecionada. Não representam probabilidade garantida.</div></div>`}

<script>

const renderStatsWithShots=renderStatsSection;renderStatsSection=function(){if(currentStatsSection==='shots'){document.querySelectorAll('.stats-nav button').forEach(b=>b.classList.toggle('active',b.dataset.section==='shots'));renderShots();return}renderStatsWithShots()};
function installShotsTab(){const nav=document.querySelector('#stats .stats-nav');if(!nav||nav.querySelector('[data-section="shots"]'))return;const corners=nav.querySelector('[data-section="corners"]');const button=document.createElement('button');button.dataset.section='shots';button.innerHTML='<span>◎</span>Chutes';button.onclick=()=>{currentStatsSection='shots';currentStatsPeriod=0;renderStatsSection()};nav.insertBefore(button,corners)}

<script>

<script>
let playersData=null,playersTeam=0;
function statNumber(item,path){let value=item.statistics;for(const key of path)value=value?.[key];return Number(value)||0}
function playerPosition(item){const positions={G:'Goalkeeper',D:'Defender',M:'Midfielder',F:'Attacker',Forward:'Attacker'},value=item.statistics?.games?.position||item.player?.position;return positions[value]||value||'Midfielder'}
// Escalações nunca são projetadas a partir do elenco.
function probableEleven(){return []}
function officialEleven(team){const positions={G:'Goalkeeper',D:'Defender',M:'Midfielder',F:'Attacker'};return(team?.startXI||[]).map(x=>({player:{id:x.player.id,name:x.player.name,photo:`https://media.api-sports.io/football/players/${x.player.id}.png`},statistics:{games:{position:positions[x.player.pos]||x.player.pos,number:x.player.number}}}))}
function formationRows(players){const groups={Attacker:[],Midfielder:[],Defender:[],Goalkeeper:[]},labels={Goalkeeper:'G',Defender:'D',Midfielder:'M',Attacker:'A'};players.forEach(x=>groups[playerPosition(x)].push(x));return [groups.Goalkeeper,groups.Defender,groups.Midfielder,groups.Attacker].map(line=>`<div class="formation-line">${line.map(x=>{const position=playerPosition(x);return `<div class="pitch-player"><span class="position-badge position-${labels[position]}">${labels[position]}</span><img src="${safe(x.player.photo)}" alt=""><b>${safe(x.player.name)}</b><small>${safe(x.statistics?.games?.number||x.player?.number||'—')}</small></div>`}).join('')}</div>`).join('')}
function leader(players,label,path){const top=[...players].sort((a,b)=>statNumber(b,path)-statNumber(a,path))[0],number=top?statNumber(top,path):0;return top?`<div class="leader"><img src="${safe(top.player.photo)}" alt=""><span><small>${label}</small><strong>${safe(top.player.name)}</strong></span><b>${path.includes('rating')?number.toFixed(1):number}</b></div>`:''}
function renderPlayers(){const box=document.getElementById('players'),team=playersData.teams[playersTeam],official=playersData.confirmed?.find(x=>x.team.id===team.team.id),lineup=official?officialEleven(official):probableEleven(team.players);box.innerHTML=`<div class="team-switch">${playersData.teams.map((x,i)=>`<button class="${i===playersTeam?'active':''}" data-player-team="${i}">${safe(x.team.name)}</button>`).join('')}</div><div class="players-layout"><article><div class="lineup-status"><b>${safe(team.team.name)} · ${official?.formation||'4-3-3'}</b><span class="probable-badge ${official?'confirmed':''}">${official?'Escalação confirmada':'Possível escalação'}</span></div><div class="pitch"><div class="formation">${formationRows(lineup)}</div></div><p class="players-note">${official?'Escalação oficial fornecida pela competição.':'Estimativa baseada em posição, participações, titularidades e nota na temporada. A formação oficial costuma sair perto do início da partida.'}</p></article><aside class="card"><h2>Destaques individuais</h2><div class="leaders">${leader(team.players,'Gols',['goals','total'])}${leader(team.players,'Assistências',['goals','assists'])}${leader(team.players,'Chutes no gol',['shots','on'])}${leader(team.players,'Desarmes',['tackles','total'])}${leader(team.players,'Melhor nota',['games','rating'])}</div></aside></div>`;box.querySelectorAll('[data-player-team]').forEach(b=>b.onclick=()=>{playersTeam=Number(b.dataset.playerTeam);renderPlayers()})}

const playersSection=document.createElement('section');playersSection.id='players';playersSection.className='view';playersSection.innerHTML='<div class="card"><div class="empty">Abra esta aba para carregar os jogadores.</div></div>';document.querySelector('main').appendChild(playersSection);const playersButton=document.createElement('button');playersButton.className='tab';playersButton.dataset.tab='players';playersButton.textContent='Jogadores';playersButton.onclick=()=>{document.querySelector('.tab.active')?.classList.remove('active');document.querySelector('.view.active')?.classList.remove('active');playersButton.classList.add('active');playersSection.classList.add('active');loadPlayers()};document.querySelector('.tab[data-tab="events"]').before(playersButton);

  const parsed=entries.map(item=>{const match=/^(\d+):(\d+)$/.exec(item.player?.grid||'');return {...item,_row:match?Number(match[1]):null,_col:match?Number(match[2]):null}});
  const maxRow=Math.max(1,...parsed.map(x=>x._row||1));

async function loadPlayers(force=false,silent=false){
  const box=document.getElementById('players');
  if(!/^\d+$/.test(id||'')){box.innerHTML='<div class="card lineup-message"><h2>ID da partida inválido</h2></div>';return}
  if(force&&Date.now()<lineupRefreshLockedUntil)return;
  if(playersData&&!force)return renderPlayers();

  if(!silent)box.innerHTML='<div class="lineup-skeleton" aria-label="Carregando escalação"></div>';
